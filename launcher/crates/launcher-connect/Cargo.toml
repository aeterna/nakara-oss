# SPDX-License-Identifier: MIT

[package]
name = "launcher-connect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Start Rongroi Connect with the handoff contract v1 (ADR 0002 decision 8)"
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
getrandom = "=0.3.4"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Builds the mock Connect binary the handoff integration tests drive.
mock = []

[[bin]]
name = "mock-connect"
path = "src/bin/mock-connect.rs"
required-features = ["mock"]
