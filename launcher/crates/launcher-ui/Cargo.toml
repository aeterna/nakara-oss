[package]
name = "launcher-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aeterna-launcher"
path = "src/main.rs"

[dependencies]
dirs = "=6.0.0"
iced = { version = "=0.14.0", features = ["svg"] }
launcher-connect = { path = "../launcher-connect" }
launcher-core = { path = "../launcher-core" }
launcher-games = { path = "../launcher-games" }
launcher-http = { path = "../launcher-http" }
launcher-net = { path = "../launcher-net" }
launcher-thai = { path = "../launcher-thai" }
launcher-update = { path = "../launcher-update" }
semver = "=1.0.28"
time = "=0.3.36"

[dev-dependencies]
ed25519-dalek = "=2.1.0"

[build-dependencies]
launcher-core = { path = "../launcher-core" }
