[package]
name = "launcher-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Signed update manifests and exe swap (ADR 0002 decision 7)"
publish = false

[dependencies]
ed25519-dalek = "=2.1.0"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
thiserror = "=2.0.21"
time = { version = "=0.3.47", features = ["parsing", "formatting"] }

[dev-dependencies]
tempfile = "=3.27.0"
