# SPDX-License-Identifier: MIT
# The AETERNA Game build of the launcher (ADR 0002 decision 3). Data only: names, hosts, theme tokens, feature flags.
# Shape: launcher/schema/server.schema.json. Fork this file (see ../example) to ship a launcher for your own server.
schema = 1

[server]
id = "nakara"
name = "Nakara City"
game = "fivem-enhanced"
connect = "play.nakara-city.com:30120"
operator = "AETERNA Game"
contact_email = "support@nakara-city.com"
feed = "https://nakara-city.com/api/launcher/v1"
invite_url = "https://discord.gg/8EVHX5R9CE"
release_repo = "aeterna/nakara-oss"
# The ed25519 public key that signs AETERNA launcher updates (owner, 2026-11-15; docs/maintainers/launcher-release.md).
update_keys = ["fcbcbdd4d1e801c6ea5f79ef2e94c311174d593823b52973cce0e4cf25db8a58"]

[theme]
template = "dusk"
brand = "AETERNA Game"
accent = "#0c7a60"

[features]
rongroi_connect = true
# The studio's other games in the sidebar stay off until the feed can list them (owner, 2026-11-15).
studio_games = false
