# AETERNA Starter Kit: add this to server.cfg, after ox_lib, oxmysql, qbx_core and ox_inventory.
# Language shown to players: th or en. setr is required because clients read it.
setr aeterna_locale "en"
# Offset used for the clock in the kit.
setr aeterna_timezone "+00:00"
# Optional: your own theme, see docs/guides/starter-kit.en.md.
# setr aeterna_theme "nui://my_theme/theme.css"

ensure aeterna_core
ensure aeterna_uikit
ensure aeterna_notify
ensure aeterna_layout
ensure aeterna_hudkit
ensure aeterna_phonekit
ensure aeterna_invkit

# Who may send announcements and run the kit's self tests.
add_ace group.admin aeterna.notify.announce allow
add_ace group.admin aeterna.core.selftest allow
