<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-labelledby="t d" lang="th">
<title id="t">Trust Architecture ของ nakara-oss</title><desc id="d">source และ oss.json ผ่าน PR gate (devkit safety ทำให้ PR ล้มถ้าโค้ดใช้เกินที่ oss.json ประกาศ · oss.json ที่เปลี่ยนต้องผ่าน CODEOWNERS) แล้ว release ใน CI พร้อม provenance attestation และ SHA256SUMS แล้วเจ้าของ server ตรวจซ้ำด้วยเครื่องมือตัวเดียวกันก่อน ensure · scanner จับไม่ได้: logic bomb ใน API ที่ประกาศไว้ · export ของ resource อื่น · server ที่เชื่อ client</desc>
<style>
.z{fill:#eef1ec}.n{fill:#fff;stroke:#c9cfc6;stroke-width:1.2}.a{fill:#dcefe8;stroke:#1f6f5c;stroke-width:1.3}
.i{fill:#e1ebf7;stroke:#28588f;stroke-width:1.2}.w{fill:#fbecd6;stroke:#a35c00;stroke-width:1.2}.b{fill:#fbe3e1;stroke:#b3261e;stroke-width:1.2}
.t{fill:#1d2420;font:13px 'Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif}
.s{fill:#5c665f;font:11.5px 'Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif}
.m{fill:#1d2420;font:11.5px ui-monospace,Menlo,Consolas,monospace}
.h{fill:#5c665f;font:600 12px 'Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;letter-spacing:.06em}
.tb{fill:#b3261e;font:12px 'Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif}
.ar{stroke:#1f6f5c;stroke-width:1.6;fill:none}.am{stroke:#8a948c;stroke-width:1.3;fill:none}
.ab{stroke:#b3261e;stroke-width:1.3;fill:none;stroke-dasharray:5 4}.ha{fill:#1f6f5c}
@media (prefers-color-scheme:dark){
.z{fill:#1d2320}.n{fill:#161b18;stroke:#3a433d}.a{fill:#17352d;stroke:#5cc4a6}.i{fill:#172a40;stroke:#8ab8ef}
.w{fill:#3a2a12;stroke:#f0a94a}.b{fill:#3b1a18;stroke:#f28b82}.t,.m{fill:#e4e9e5}.s,.h{fill:#9aa59e}.tb{fill:#f28b82}
.ar{stroke:#5cc4a6}.ab{stroke:#f28b82}.ha{fill:#5cc4a6}}
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ha"/></marker></defs>
<rect x="10" y="10" width="230" height="300" rx="10" class="z"/>
<rect x="260" y="10" width="260" height="300" rx="10" class="z"/>
<rect x="540" y="10" width="240" height="300" rx="10" class="z"/>
<rect x="800" y="10" width="310" height="300" rx="10" class="z"/>
<text x="24" y="34" class="h">1 · ผู้เขียน</text>
<text x="274" y="34" class="h">2 · PR GATE (CI)</text>
<text x="554" y="34" class="h">3 · RELEASE (CI)</text>
<text x="814" y="34" class="h">4 · SERVER ของคุณ</text>
<rect x="24" y="56" width="202" height="62" rx="7" class="n"/>
<text x="36" y="80" class="t">source Lua / JS</text>
<text x="36" y="98" class="s">resource ใน packages/</text>
<rect x="24" y="140" width="202" height="78" rx="7" class="a"/>
<text x="36" y="164" class="m">oss.json</text>
<text x="36" y="182" class="s">ประกาศ HTTP host · command</text>
<text x="36" y="198" class="s">convar · net event · DB · ไฟล์</text>
<rect x="274" y="56" width="232" height="56" rx="7" class="n"/>
<text x="286" y="80" class="m">devkit check</text>
<text x="286" y="98" class="s">bug ที่ runtime ไม่เตือน</text>
<rect x="274" y="124" width="232" height="68" rx="7" class="a"/>
<text x="286" y="148" class="m">devkit safety</text>
<text x="286" y="166" class="s">load() · คำสั่ง OS · obfuscation</text>
<text x="286" y="182" class="s">ใช้เกิน oss.json = PR ล้ม</text>
<rect x="274" y="204" width="232" height="56" rx="7" class="n"/>
<text x="286" y="228" class="t">capability report</text>
<text x="286" y="246" class="s">oss.json เปลี่ยน → CODEOWNERS</text>
<rect x="554" y="56" width="212" height="56" rx="7" class="n"/>
<text x="566" y="80" class="m">release.yml</text>
<text x="566" y="98" class="s">build zip ใน CI เท่านั้น</text>
<rect x="554" y="126" width="212" height="56" rx="7" class="i"/>
<text x="566" y="150" class="t">provenance attestation</text>
<text x="566" y="168" class="s">ผูก zip กับ workflow</text>
<rect x="554" y="196" width="212" height="56" rx="7" class="i"/>
<text x="566" y="220" class="m">SHA256SUMS</text>
<text x="566" y="238" class="s">ไฟล์ไม่ถูกแก้</text>
<rect x="814" y="56" width="282" height="44" rx="7" class="i"/><text x="826" y="83" class="m">gh attestation verify</text>
<rect x="814" y="110" width="282" height="44" rx="7" class="i"/><text x="826" y="137" class="m">sha256sum -c SHA256SUMS</text>
<rect x="814" y="164" width="282" height="44" rx="7" class="i"/><text x="826" y="191" class="m">npx fivem-devkit safety</text>
<rect x="814" y="226" width="282" height="56" rx="7" class="a"/>
<text x="826" y="250" class="m">ensure resource</text>
<text x="826" y="268" class="s">ตรวจซ้ำแล้ว + อ่านโค้ดเอง</text>
<path d="M125 118 V140" class="am" marker-end="url(#ma)"/>
<path d="M226 90 H274" class="ar" marker-end="url(#ma)"/>
<path d="M226 180 H250 V232 H274" class="ar" marker-end="url(#ma)"/>
<path d="M506 158 H530 V84 H554" class="ar" marker-end="url(#ma)"/>
<path d="M660 112 V126" class="am" marker-end="url(#ma)"/>
<path d="M660 182 V196" class="am" marker-end="url(#ma)"/>
<path d="M766 224 H790 V78 H814" class="ar" marker-end="url(#ma)"/>
<path d="M955 100 V110" class="am" marker-end="url(#ma)"/>
<path d="M955 154 V164" class="am" marker-end="url(#ma)"/>
<path d="M955 208 V226" class="am" marker-end="url(#ma)"/>
<path d="M506 176 H522 V350 H400" class="ab"/><path d="M1096 132 H1104 V350 H1000" class="ab"/>
<rect x="400" y="334" width="600" height="32" rx="6" class="b"/>
<text x="414" y="355" class="tb">safety ไม่ผ่าน = PR ล้ม ไม่มี release · zip ไม่ตรง attestation/SHA256 = คุณเห็นและไม่ ensure</text>
<text x="24" y="390" class="s">ด่าน 2–3 เราทำใน CI · ด่าน 4 คุณทำซ้ำเองได้ด้วยเครื่องมือตัวเดียวกัน ไม่ต้องเชื่อคำพูดเรา</text>
<rect x="24" y="402" width="1072" height="30" rx="6" class="w"/>
<text x="38" y="422" class="t">scanner จับไม่ได้: logic bomb ใน API ที่ประกาศไว้ · การเรียก export ของ resource อื่น · server ที่เชื่อ client → ยังต้องมีคนอ่านโค้ด</text>
</svg>
