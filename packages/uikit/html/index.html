<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aeterna_uikit</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="uikit-root" class="uikit-root">
        <div id="panel-layer" class="layer layer-center hidden" role="dialog" aria-modal="true"></div>
        <div id="prompt-layer" class="layer layer-center hidden" role="dialog" aria-modal="true"></div>
        <div id="skill-layer" class="layer layer-bottom hidden" role="region" aria-live="polite"></div>
        <div id="progress-layer" class="layer layer-bottom hidden" role="status" aria-live="polite"></div>
        <div id="hints-layer" class="hints-container hidden" role="region" aria-live="polite"></div>
    </div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
</body>
</html>
