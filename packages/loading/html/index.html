<!DOCTYPE html>
<html lang="en" data-preset="asphalt">
<head>
    <meta charset="utf-8">
    <title>aeterna_loading</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div class="backdrop" id="backdrop"></div>

    <main class="panel">
        <header class="brand">
            <h1 class="name" id="name"></h1>
            <p class="tagline" id="tagline" hidden></p>
        </header>

        <ol class="stages" id="stages" aria-live="polite">
            <li class="stage" data-stage="1">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
                <span class="label" data-key="loading.stage.map"></span>
                <span class="pct"></span>
            </li>
            <li class="stage" data-stage="2">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
                <span class="label" data-key="loading.stage.scripts"></span>
                <span class="pct"></span>
            </li>
            <li class="stage" data-stage="3">
                <span class="mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                </span>
                <span class="label" data-key="loading.stage.character"></span>
                <span class="pct"></span>
            </li>
        </ol>

        <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div class="fill" id="fill"></div>
        </div>
        <p class="still" id="still" data-key="loading.still" hidden></p>

        <p class="tip" id="tip" hidden>
            <span class="tip-label" data-key="loading.tip"></span>
            <span class="tip-text" id="tip-text"></span>
        </p>
    </main>

    <button class="audio" id="audio" type="button" hidden>
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/>
            <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
            <line x1="22" x2="16" y1="9" y2="15"/>
            <line x1="16" x2="22" y1="9" y2="15"/>
        </svg>
        <span class="audio-label" id="audio-label"></span>
    </button>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
