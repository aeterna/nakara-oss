<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aeterna_notify</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notify-root" class="notify-root">
        <div id="announce-layer" class="announce-box pos-announce-default hidden" role="status" aria-live="polite"></div>
        <div id="toast-stack" class="toast-stack pos-top-left" role="region" aria-live="polite"></div>
        <div id="motd-layer" class="motd-layer hidden" role="dialog" aria-modal="true"></div>
    </div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
</body>
</html>
