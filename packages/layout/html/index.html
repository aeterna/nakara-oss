<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aeterna_layout</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout-root" class="layout-root hidden" role="application" aria-label="HUD layout editor">
        <div id="grid-layer" class="grid-layer hidden" aria-hidden="true"></div>
        <div id="canvas-layer" class="canvas-layer"></div>
        <div id="empty-banner" class="empty-banner hidden" role="status"></div>
        <div id="inspector-panel" class="inspector-panel hidden" role="region"></div>
        <div id="toolbar-panel" class="toolbar-panel" role="toolbar"></div>
        <div id="confirm-layer" class="confirm-layer hidden" role="dialog" aria-modal="true"></div>
        <div id="share-layer" class="confirm-layer hidden" role="dialog" aria-modal="true"></div>
    </div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
</body>
</html>
