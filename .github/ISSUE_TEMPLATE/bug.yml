name: Bug report
description: Something in a package does not work
labels: [bug]
body:
  - type: input
    id: package
    attributes: { label: Package and version, placeholder: "nakara_cargen_fix 1.0.0" }
    validations: { required: true }
  - type: input
    id: build
    attributes: { label: Server artifact / game build / framework, placeholder: "FXServer 12345 · b3258 · Qbox" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Expected vs actual. Paste logs as text, not screenshots." }
    validations: { required: true }
