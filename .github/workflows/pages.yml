# Publishes site/ to GitHub Pages (https://aeterna.github.io/nakara-oss/). The build fills the {{…}} tokens
# in site/ with the latest released versions and today's date, and fails if a token is left unfilled, so the
# page never shows a version typed by hand. Not a required check, so the root `paths:` filter is fine.
# Agent: Claude Code - Claude Opus 5.5

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/og*.svg"
      - ".github/workflows/pages.yml"
  # A published release changes the versions on the page without a commit.
  release:
    types: [published]
  # A missed release event is caught by the next day's run.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on the tag, and the github-pages environment deploys from main only, so a published
  # release starts this workflow again on main instead of deploying itself.
  redeploy:
    name: redeploy on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    name: deploy
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill version and date tokens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases \
              --json tagName,publishedAt \
              --jq "[.[] | select(.tagName | startswith(\"$1@\"))] | sort_by(.publishedAt) | last | .tagName // \"\"" \
              | sed "s/^$1@//"
          }
          devkit="$(latest fivem-devkit)"
          cargen="$(latest nakara_cargen_fix)"
          today="$(date -u +%Y-%m-%d)"
          for v in "$devkit" "$cargen"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no released version found (got '$v')"; exit 1; }
          done
          echo "fivem-devkit $devkit · nakara_cargen_fix $cargen · date $today"
          out="$RUNNER_TEMP/_site"
          cp -R site "$out"
          find "$out" -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i \
                -e "s/{{devkit\.version}}/$devkit/g" \
                -e "s/{{cargen\.version}}/$cargen/g" \
                -e "s/{{site\.date}}/$today/g"
          if grep -rn '{{' "$out" --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::unfilled token left in the built site"
            exit 1
          fi
      - name: Render the social preview image (when its SVG source exists)
        run: |
          set -euo pipefail
          if [ -f docs/assets/og.svg ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq librsvg2-bin fonts-noto-core
            rsvg-convert -w 1200 -h 630 docs/assets/og.svg -o "$RUNNER_TEMP/_site/og.png"
          else
            echo "docs/assets/og.svg not present yet; og.png skipped"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/_site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
