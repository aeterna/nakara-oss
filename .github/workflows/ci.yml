# Runs on every PR (including forks). Security posture:
#  - `pull_request` only, never `pull_request_target` — fork code must never run with a write token or secrets
#  - token is read-only; no secrets are referenced anywhere in this workflow
#  - every action is pinned to a full commit SHA (Dependabot bumps them)
#  - `npm ci --ignore-scripts` — dependency install scripts never run
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devkit:
    name: devkit (tests · checks · safety)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: unit tests
        run: npm test --workspace packages/devkit
      - name: static checks (dogfood)
        run: node packages/devkit/bin/fivem-devkit.js check
      - name: safety scan (every package + template)
        run: node packages/devkit/bin/fivem-devkit.js safety
      - name: oss.json valid + capability diff vs base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/capability-report.mjs "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  lua:
    name: lua (busted)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
      - run: luarocks install busted
      - run: busted --config-file=.busted

  workflows:
    name: workflow lint (actionlint · zizmor)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit carries Signed-off-by matching its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"

  # AETERNA delegated delivery (T2): every commit of a team PR carries `Agent:`, product code carries
  # `Delegated-Run:`, the rest `Exempt:` — one trailer block with `Signed-off-by:` (the DCO job above reads the
  # same block, so both pass together). Reads the PR's own commits: squash merges drop trailers on main.
  # The checker is tools/provenance of the private aeterna/org-standards (default branch, so a PR cannot change
  # the rules it is judged by), read with a short-lived token of the GitHub App aeterna-ci-org-standards-read
  # (contents:read on org-standards only). Var ORG_STANDARDS_APP_CLIENT_ID + secret ORG_STANDARDS_APP_PRIVATE_KEY are
  # Pik's. Missing var/secret (fork PRs, before setup) or a failed mint/checkout => skip with a notice.
  # ADVISORY, never required: failures are a warning + step summary and the job always succeeds.
  provenance:
    name: provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    timeout-minutes: 5
    steps:
      - name: app credentials present?
        id: creds
        env:
          APP_CLIENT_ID: ${{ vars.ORG_STANDARDS_APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.ORG_STANDARDS_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ "$APP_KEY_SET" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=provenance (advisory)::ORG_STANDARDS_APP_CLIENT_ID / ORG_STANDARDS_APP_PRIVATE_KEY not available (fork PR or not set up yet) — skipped"; fi
      - name: mint org-standards read token
        id: app
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_STANDARDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_STANDARDS_APP_PRIVATE_KEY }}
          owner: aeterna
          repositories: org-standards
          permission-contents: read
      - name: checkout org-standards (checker)
        id: org
        if: steps.app.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeterna/org-standards
          token: ${{ steps.app.outputs.token }}
          path: .org-standards
          sparse-checkout: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.org.outcome == 'success'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - name: provenance of the PR's commits (advisory)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CREDS: ${{ steps.creds.outputs.ok }}
          APP: ${{ steps.app.outcome }}
          ORG: ${{ steps.org.outcome }}
        run: |
          if [ "$CREDS" = "true" ] && [ "$ORG" != "success" ]; then
            echo "::notice title=provenance (advisory)::could not read org-standards (token: $APP, checkout: $ORG) — skipped"
          fi
          [ "$ORG" = "success" ] || exit 0
          if [ ! -f .org-standards/tools/provenance ]; then
            echo "::notice title=provenance (advisory)::tools/provenance not found in org-standards — skipped"; exit 0
          fi
          rc=0
          (cd pr && python3 ../.org-standards/tools/provenance "$BASE_SHA..$HEAD_SHA") > provenance.txt 2>&1 || rc=$?
          # The output quotes PR commit subjects: never let a line act as a workflow command or as Markdown.
          stop="stop-$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"; cat provenance.txt; echo "::$stop::"
          if [ "$rc" -eq 1 ]; then
            echo "::warning title=provenance (advisory)::commits without the trailers T2 asks for; see the step summary"
            { echo '### provenance (advisory)'; echo; sed 's/^/    /' provenance.txt; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -ne 0 ]; then
            echo "::notice title=provenance (advisory)::checker exited $rc (usage or git error) — not judged"
          fi
          exit 0
