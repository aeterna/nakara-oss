# SPDX-License-Identifier: MIT
# The launcher (ADR 0002): tests and a release build on a GitHub-hosted Windows runner, with the exe size and a
# screenshot of the window as artifacts. Hosted runners only: this public repo never runs PR code on a self-hosted one.
name: launcher

on:
  push:
    branches: ['feat/launcher-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: launcher (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: |
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format and clippy
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build (release)
        run: |
          cargo build --locked --release -p launcher-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item target/release/aeterna-launcher.exe
          "exe_bytes=$($exe.Length)" | Out-File -Encoding utf8 -Append out.txt
      - name: Run and take a screenshot
        run: |
          # The runner's screen is 1024x768, smaller than the 1280x800 window. Not a gate: the screenshot is for review only.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "resolution=1920x1080" | Out-File -Encoding utf8 -Append out.txt }
          catch { "resolution=unchanged ($($_.Exception.Message))" | Out-File -Encoding utf8 -Append out.txt }
          $p = Start-Process -FilePath target/release/aeterna-launcher.exe -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "still_running=$(-not $p.HasExited)" | Out-File -Encoding utf8 -Append out.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content out.txt
      - name: Build the example profile and take a screenshot
        env:
          AETERNA_LAUNCHER_PROFILE: profiles/example/server.toml
        run: |
          cargo build --locked --release -p launcher-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process -FilePath target/release/aeterna-launcher.exe -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot-example.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "example_still_running=$(-not $p.HasExited)" | Out-File -Encoding utf8 -Append out.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content out.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-windows
          path: |
            launcher/out.txt
            launcher/screenshot.png
            launcher/screenshot-example.png
          if-no-files-found: error
          retention-days: 7
